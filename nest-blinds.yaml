substitutions:
  pulse_duration: "1.5s"

  # Secrets - override via upload.sh
  wifi_ssid: "PLACEHOLDER"
  wifi_password: "PLACEHOLDER"
  mqtt_broker: "PLACEHOLDER"
  mqtt_username: "PLACEHOLDER"
  mqtt_password: "PLACEHOLDER"
  ota_password: "PLACEHOLDER"

esphome:
  name: nest-blinds
  friendly_name: Nest Blinds

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LOG_COLORS: "n"

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  fast_connect: true
  reboot_timeout: 15min

mqtt:
  broker: ${mqtt_broker}
  port: 1883
  username: ${mqtt_username}
  password: ${mqtt_password}
  discovery: true
  discovery_prefix: homeassistant
  discovery_unique_id_generator: mac
  topic_prefix: nest-blinds
  idf_send_async: true
  log_topic: nest-blinds/logs
  reboot_timeout: 15min
  on_connect:
    - logger.log: "MQTT Connected!"
  on_disconnect:
    - logger.log: "MQTT Disconnected!"

ota:
  platform: esphome
  password: ${ota_password}

logger:
  level: INFO

# AUNMAS Dual Channel Relay Module (ESP32-WROOM-32E)
# Status LED: GPIO 23, Relay Down: GPIO 17 (right), Relay Up: GPIO 16 (left)
# Hidden inside Nest Protect case, powered by Nest 5V battery system
# Relays simulate button presses on a blind remote (soldered leads)

output:
  - platform: gpio
    pin: 23
    id: led_output

# Relays are internal - controlled by buttons
switch:
  - platform: gpio
    pin: 17
    id: relay_down
    internal: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: 16
    id: relay_up
    internal: true
    restore_mode: ALWAYS_OFF

# Cover entity - shows up as blinds with up/down in HA
cover:
  - platform: template
    name: "Blinds"
    id: blinds
    device_class: blind
    optimistic: true
    assumed_state: true
    has_position: false
    open_action:
      - logger.log: "Blinds Up pressed"
      - output.turn_on: led_output
      - switch.turn_on: relay_up
      - delay: ${pulse_duration}
      - switch.turn_off: relay_up
      - output.turn_off: led_output
    close_action:
      - logger.log: "Blinds Down pressed"
      - output.turn_on: led_output
      - switch.turn_on: relay_down
      - delay: ${pulse_duration}
      - switch.turn_off: relay_down
      - output.turn_off: led_output

button:
  - platform: template
    name: "Restart"
    id: btn_restart
    icon: "mdi:restart"
    on_press:
      - logger.log: "Restart requested"
      - delay: 500ms
      - lambda: 'App.safe_reboot();'

# Diagnostics
sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 60s
    icon: "mdi:wifi"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
      icon: "mdi:ip-network"

  - platform: wifi_info
    ssid:
      name: "WiFi Network"
      id: wifi_network
      icon: "mdi:wifi-cog"
