ota:
  platform: esphome
  password: ${ota_password}

logger:
  level: INFO

# AUNMAS Dual Channel Relay Module (ESP32-WROOM-32E)
# Status LED: GPIO 23, Relays: GPIO 16 (left), GPIO 17 (right)
# Hidden inside Nest Protect case, powered by Nest 5V battery system
# Relays simulate button presses on a blind remote (soldered leads)

output:
  - platform: gpio
    pin: 23
    id: led_output

# Relays are internal - controlled by buttons
switch:
  - platform: gpio
    pin: 16
    id: relay_down
    internal: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: 17
    id: relay_up
    internal: true
    restore_mode: ALWAYS_OFF

# HA buttons - momentary pulse to simulate remote button press
button:
  - platform: template
    name: "Blinds Down"
    id: btn_blinds_down
    icon: "mdi:blinds"
    on_press:
      - logger.log: "Blinds Down pressed"
      - output.turn_on: led_output
      - switch.turn_on: relay_down
      - delay: ${pulse_duration}
      - switch.turn_off: relay_down
      - output.turn_off: led_output

  - platform: template
    name: "Blinds Up"
    id: btn_blinds_up
    icon: "mdi:blinds-open"
    on_press:
      - logger.log: "Blinds Up pressed"
      - output.turn_on: led_output
      - switch.turn_on: relay_up
      - delay: ${pulse_duration}
      - switch.turn_off: relay_up
      - output.turn_off: led_output

  - platform: template
    name: "Restart"
    id: btn_restart
    icon: "mdi:restart"
    on_press:
      - logger.log: "Restart requested"
      - delay: 500ms
      - lambda: 'App.safe_reboot();'

# Diagnostics
sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 60s
    icon: "mdi:wifi"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
      icon: "mdi:ip-network"

  - platform: wifi_info
    ssid:
      name: "WiFi Network"
      id: wifi_network
      icon: "mdi:wifi-cog"
