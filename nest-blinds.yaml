substitutions:
  pulse_duration: "1s"

  # Secrets - override via upload.sh
  wifi_ssid: "PLACEHOLDER"
  wifi_password: "PLACEHOLDER"
  mqtt_broker: "PLACEHOLDER"
  mqtt_username: "PLACEHOLDER"
  mqtt_password: "PLACEHOLDER"
  ota_password: "PLACEHOLDER"

esphome:
  name: nest-blinds
  friendly_name: Nest Blinds

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LOG_COLORS: "n"

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  fast_connect: true
  reboot_timeout: 15min

mqtt:
  broker: ${mqtt_broker}
  port: 8883
  username: ${mqtt_username}
  password: ${mqtt_password}
  discovery: true
  discovery_prefix: homeassistant
  discovery_unique_id_generator: mac
  topic_prefix: nest-blinds
  idf_send_async: true
  log_topic: nest-blinds/logs
  reboot_timeout: 15min
  on_connect:
    - logger.log: "MQTT Connected!"
