ota:
  platform: esphome
  password: ${ota_password}

logger:
  level: INFO

# AUNMAS Dual Channel Relay Module (ESP32-WROOM-32E)
# DO1: GPIO 16, DO2: GPIO 17 (relays)
# DI1: GPIO 32, DI2: GPIO 25, DI3: GPIO 27 (inputs)
# Status LED: GPIO 23

output:
  - platform: gpio
    pin: 23
    id: led_output

# Relay - internal, pulsed by cover actions and move button
switch:
  - platform: gpio
    pin: 16
    id: relay_door
    internal: true
    restore_mode: ALWAYS_OFF

# Door position sensors
binary_sensor:
  - platform: gpio
    pin:
      number: 32
      mode: INPUT_PULLUP
      inverted: true
    name: "Door Closed"
    id: door_closed
    device_class: garage_door
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms

  - platform: gpio
    pin:
      number: 25
      mode: INPUT_PULLUP
      inverted: true
    name: "Door Open"
    id: door_open
    device_class: garage_door
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms

  # Physical move button (DI3) - press to toggle door
  - platform: gpio
    pin:
      number: 27
      mode: INPUT_PULLUP
      inverted: true
    name: "Move Button"
    id: move_button
    internal: true
    filters:
      - delayed_on: 200ms
    on_press:
      - script.execute: pulse_door

# Garage door cover entity
cover:
  - platform: template
    name: "Garage Door"
    id: garage_door
    device_class: garage
    lambda: |-
      if (id(door_closed).state && id(door_open).state) {
        // Both sensors on - error/impossible state
        return {};
      }
      if (id(door_closed).state) {
        return COVER_CLOSED;
      }
      if (id(door_open).state) {
        return COVER_OPEN;
      }
      // Neither sensor - door is moving
      return {};
    open_action:
      - script.execute: pulse_door
    close_action:
      - script.execute: pulse_door
    stop_action:
      - script.execute: pulse_door
    optimistic: false
    assumed_state: false
    has_position: false

script:
  - id: pulse_door
    mode: single
    then:
      - logger.log: "Door button pulsed"
      - output.turn_on: led_output
      - switch.turn_on: relay_door
      - delay: ${pulse_duration}
      - switch.turn_off: relay_door
      - output.turn_off: led_output

button:
  - platform: template
    name: "Restart"
    id: btn_restart
    icon: "mdi:restart"
    on_press:
      - logger.log: "Restart requested"
      - delay: 500ms
      - lambda: 'App.safe_reboot();'

# Diagnostics
sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 60s
    icon: "mdi:wifi"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
      icon: "mdi:ip-network"

  - platform: wifi_info
    ssid:
      name: "WiFi Network"
      id: wifi_network
      icon: "mdi:wifi-cog"
